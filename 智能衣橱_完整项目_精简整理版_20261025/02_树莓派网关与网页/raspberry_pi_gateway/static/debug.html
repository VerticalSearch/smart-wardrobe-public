<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>树莓派衣橱调试台</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #1e262b;
      --muted: #63727c;
      --line: #d9e2e6;
      --green: #2f7d5c;
      --blue: #2f6f9f;
      --orange: #c86935;
      --danger: #bd3f3f;
      --soft: #eef3f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    h1, h2, h3, p { margin: 0; letter-spacing: 0; }
    h1 { font-size: 28px; }
    h2 { font-size: 17px; }
    h3 { font-size: 15px; }

    .status-pill {
      min-width: 112px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    .status-pill.ok { background: #e6f3ed; color: var(--green); border-color: #b9ddcd; }
    .status-pill.bad { background: #fae9e9; color: var(--danger); border-color: #efc0c0; }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .panel + .panel { margin-top: 14px; }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      min-height: 72px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 6px;
    }

    .metric span { color: var(--muted); font-size: 12px; }
    .metric b { font-size: 14px; overflow-wrap: anywhere; }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfdfe;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      padding: 0 10px;
      outline: none;
    }

    input, select { height: 40px; }
    textarea { min-height: 128px; padding: 10px; resize: vertical; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #eef3f5;
      color: var(--ink);
      font: inherit;
      font-weight: 750;
      padding: 0 13px;
      cursor: pointer;
    }

    button.primary { background: var(--green); color: #fff; }
    button.blue { background: var(--blue); color: #fff; }
    button.orange { background: var(--orange); color: #fff; }
    button.danger { background: var(--danger); color: #fff; }

    .task-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .task-grid button { width: 100%; }

    pre, .log {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111b20;
      color: #dceff4;
      font: 12px/1.55 Consolas, "Courier New", monospace;
      overflow: auto;
    }

    pre { min-height: 180px; padding: 12px; }
    .log { height: 420px; padding: 10px; }
    .log div { border-bottom: 1px solid rgba(255,255,255,0.08); padding: 5px 0; overflow-wrap: anywhere; }
    .muted { color: var(--muted); font-size: 13px; }

    @media (max-width: 900px) {
      .grid, .form-grid, .form-grid.two, .form-grid.four, .metrics, .task-grid {
        grid-template-columns: 1fr;
      }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>树莓派衣橱调试台</h1>
        <p class="muted">CH340 串口 / USB 摄像头 / 云端上传</p>
      </div>
      <div class="status-pill" id="overall">连接中</div>
    </section>

    <section class="metrics">
      <div class="metric"><span>CH340</span><b id="serialStatus">--</b></div>
      <div class="metric"><span>摄像头</span><b id="cameraStatus">--</b></div>
      <div class="metric"><span>MQTT</span><b id="mqttStatus">--</b></div>
    </section>

    <section class="grid">
      <div>
        <section class="panel">
          <div class="panel-title"><h2>任务码</h2><span class="muted">@ACMD</span></div>
          <div class="task-grid">
            <button class="primary" data-task="6">放衣 6</button>
            <button class="primary" data-task="7">取衣 7</button>
            <button class="blue" data-task="8">风扇移动 8</button>
            <button class="blue" data-task="9">风扇停止 9</button>
            <button class="orange" data-task="10">刷毛 10</button>
            <button class="danger" id="emergencyBtn">急停 0</button>
            <button id="captureBtn">拍照上传</button>
            <button id="reconnectBtn">重连串口</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title"><h2>步进电机</h2><span class="muted">@MCMD</span></div>
          <div class="form-grid four">
            <label>通道<select id="stepperChannel">
              <option value="1">1 X轴</option>
              <option value="2">2 Y轴</option>
              <option value="3">3 Z轴</option>
              <option value="4">4 伸缩</option>
              <option value="5">5 刷毛</option>
              <option value="6">6 热风</option>
            </select></label>
            <label>角度<input id="stepperAngle" type="number" value="1000"></label>
            <label>方向<select id="stepperDir"><option value="0">正向</option><option value="1">反向</option></select></label>
            <label>模式<select id="stepperMode"><option value="relative">相对</option><option value="absolute">目标</option></select></label>
          </div>
          <div class="actions">
            <button class="primary" id="stepperMoveBtn">发送运动</button>
            <button id="enableBtn">使能</button>
            <button id="disableBtn">失能</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title"><h2>舵机和输出</h2><span class="muted">@SCMD / @OCMD</span></div>
          <div class="form-grid four">
            <label>舵机<select id="servoChannel"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
            <label>角度<input id="servoAngle" type="number" min="0" max="270" value="135"></label>
            <label>输出<select id="outputDevice"><option value="uv_lamp">紫外灯</option><option value="vent_fan">换气风扇</option></select></label>
            <label>开关<select id="outputEnable"><option value="1">开启</option><option value="0">关闭</option></select></label>
          </div>
          <div class="actions">
            <button class="primary" id="servoBtn">发送舵机</button>
            <button class="blue" id="outputBtn">发送输出</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title"><h2>自定义 JSON</h2><span class="muted">POST /api/control</span></div>
          <textarea id="payload">{"action":"todo","action_id":6}</textarea>
          <div class="actions">
            <button class="primary" id="sendJsonBtn">发送 JSON</button>
            <button id="statusBtn">刷新状态</button>
          </div>
        </section>
      </div>

      <aside>
        <section class="panel">
          <div class="panel-title"><h2>最近状态</h2><span class="muted" id="updatedAt">--</span></div>
          <pre id="statusJson">{}</pre>
        </section>
        <section class="panel">
          <div class="panel-title"><h2>串口日志</h2><span class="muted">最近记录</span></div>
          <div class="log" id="log"></div>
        </section>
      </aside>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function uid(prefix) {
      return `${prefix}-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
    }

    async function postJson(path, payload = {}) {
      const response = await fetch(path, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || data.error || response.statusText);
      await refreshStatus();
      return data;
    }

    function withId(payload, prefix) {
      return {...payload, id: uid(prefix), source: "pi-debug"};
    }

    async function sendControl(payload, prefix = "debug") {
      $("payload").value = JSON.stringify(payload, null, 2);
      return postJson("/api/control", withId(payload, prefix));
    }

    function setText(id, text) { $(id).textContent = text || "--"; }

    function renderStatus(data) {
      const serial = data.serial || {};
      const camera = data.camera || {};
      const mqtt = data.mqtt || {};
      const serialText = serial.connected ? `已连接 ${serial.port}` : (serial.error || "未连接");
      const cameraText = camera.ok ? "可用" : (camera.error || "等待检测");
      const mqttText = mqtt.connected ? "已连接" : (mqtt.error || "未连接");
      setText("serialStatus", serialText);
      setText("cameraStatus", cameraText);
      setText("mqttStatus", mqttText);
      $("overall").textContent = serial.connected ? "串口在线" : "串口离线";
      $("overall").className = `status-pill ${serial.connected ? "ok" : "bad"}`;
      $("statusJson").textContent = JSON.stringify(data, null, 2);
      $("updatedAt").textContent = new Date().toLocaleTimeString();

      const log = $("log");
      log.innerHTML = "";
      for (const item of data.logs || []) {
        const line = document.createElement("div");
        line.textContent = `[${item.time}] ${item.direction}: ${item.message}`;
        log.appendChild(line);
      }
    }

    async function refreshStatus() {
      const response = await fetch("/api/status", {cache: "no-store"});
      renderStatus(await response.json());
    }

    document.querySelectorAll("[data-task]").forEach((button) => {
      button.addEventListener("click", () => sendControl({action: "todo", action_id: Number(button.dataset.task)}, `task-${button.dataset.task}`));
    });

    $("emergencyBtn").addEventListener("click", () => sendControl({action: "emergency"}, "emergency"));
    $("captureBtn").addEventListener("click", () => postJson("/api/camera/capture-upload", {upload: false, source: "debug-manual"}));
    $("reconnectBtn").addEventListener("click", () => postJson("/api/serial/reconnect", {}));
    $("statusBtn").addEventListener("click", refreshStatus);
    $("stepperMoveBtn").addEventListener("click", () => {
      sendControl({
        action: "stepper_move",
        channel: Number($("stepperChannel").value),
        angle: Number($("stepperAngle").value),
        dir: Number($("stepperDir").value),
        mode: $("stepperMode").value,
        relative: $("stepperMode").value === "relative",
        enable: true,
      }, "move");
    });
    $("enableBtn").addEventListener("click", () => sendControl({action: "stepper_enable", channel: Number($("stepperChannel").value), enable: 1}, "enable"));
    $("disableBtn").addEventListener("click", () => sendControl({action: "stepper_enable", channel: Number($("stepperChannel").value), enable: 0}, "disable"));
    $("servoBtn").addEventListener("click", () => sendControl({action: "servo", channel: Number($("servoChannel").value), angle: Number($("servoAngle").value)}, "servo"));
    $("outputBtn").addEventListener("click", () => sendControl({action: "board1_output", device: $("outputDevice").value, enable: Number($("outputEnable").value)}, "output"));
    $("sendJsonBtn").addEventListener("click", async () => {
      const payload = JSON.parse($("payload").value);
      await sendControl(payload, payload.action || "json");
    });

    refreshStatus();
    setInterval(refreshStatus, 2500);
  </script>
</body>
</html>
